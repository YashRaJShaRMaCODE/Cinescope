{% extends "base.html" %}
{% block content %}

<div class="row">
    <div class="col-md-4">
        <img src="{{ movie.poster_url }}" class="img-fluid">
    </div>
    <div class="col-md-8">
        <h2>{{ movie.title }}</h2>
        <p><strong>Release:</strong> {{ movie.release_date }}</p>
        <p><strong>Genre:</strong> 
            <a href="{% url 'genre' movie.genre %}">{{ movie.genre }}</a>
        </p>
        <p><strong>Director:</strong> 
            <a href="{% url 'director' movie.director %}">{{ movie.director }}</a>
        </p>
        <p><strong>Rating:</strong> ⭐ {{ movie.rating }}</p>
        <hr>
        <p>{{ movie.description }}</p>
    </div>
</div>

{% endblock %}
