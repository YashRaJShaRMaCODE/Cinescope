<div class="cine-grid">
    {% for movie in movies %}
        <article class="cine-card">
                <a href="{% url 'movie_detail' movie.id %}">
                    <img src="{{ movie.poster_url }}" alt="Poster for {{ movie.title }}" loading="lazy">
                    <div class="cine-card-copy">
                        <h3>{{ movie.title }}</h3>
                        <p class="cine-rating"><span aria-hidden="true">★</span> {{ movie.rating }}</p>
                    </div>
                </a>
        </article>
    {% empty %}
        <p class="cine-empty">No films found. Try another search.</p>
    {% endfor %}
</div>
{% include "pagination.html" %}
