{% if page_obj and page_obj.has_other_pages %}
<nav class="cine-pagination" aria-label="Movie pages">
    {% if page_obj.has_previous %}
    <a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>
    {% else %}<span aria-disabled="true">Previous</span>{% endif %}
    <span aria-current="page">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next</a>
    {% else %}<span aria-disabled="true">Next</span>{% endif %}
</nav>
{% endif %}
