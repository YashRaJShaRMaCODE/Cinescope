<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cinescope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #141414; color: white; }
        .navbar { background-color: #000; }
        .card { background-color: #1f1f1f; border: none; }
        .card:hover { transform: scale(1.03); transition: 0.3s; }
        a { text-decoration: none; color: white; }
        a:hover { color: #f39c12; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🎬 Cinescope</a>

        <form class="d-flex" method="GET" action="{% url 'search' %}">
            <input class="form-control me-2" type="search" name="q" placeholder="Search movies...">
            <button class="btn btn-warning">Search</button>
        </form>
    </div>
</nav>

<div class="container my-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
